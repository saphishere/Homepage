<!DOCTYPE html>
<html lang="en">
<background style='color: black;'>
<head>
    <meta charset="UTF-8">
    <title>Indexing</title>
    <script>

        if (sessionStorage.getItem('allowed_access') !== 'true') {
            window.location.replace('./site/home.html'); 
        }
        
        function home() {
        sessionStorage.setItem('allowed_access', 'false')
        window.location.replace('./site/home.html')
        }
    </script>
</head>
<body>
    <!-- I mean IG -->
    <h1 style='color: white;'>Welcome back to the main Index Page!</h1>
    <p>You got here from another page but I recommend going back unless you want something uber-specific.</p>
    
    <button onclick="home()">Go to Home Page</button>
</body>
</html>
